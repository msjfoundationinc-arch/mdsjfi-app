<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="skinGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="uniformGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ribbonGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGradFem)" stroke="#6ee7b7" stroke-width="3"/>
  <!-- Hair Behind Shoulders -->
  <path d="M46 66 C42 90, 40 120, 48 140 C52 142, 58 130, 56 110 Z" fill="#1e293b"/>
  <path d="M114 66 C118 90, 120 120, 112 140 C108 142, 102 130, 104 110 Z" fill="#1e293b"/>
  <!-- Uniform Shoulders -->
  <path d="M26 156 C30 120, 52 108, 80 108 C108 108, 130 120, 134 156 Z" fill="url(#uniformGradFem)"/>
  <!-- Uniform Vest / Trim -->
