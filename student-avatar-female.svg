  <path d="M62 108 Q72 120 80 114 Q74 96 72 96 Z" fill="#ffffff"/>
  <path d="M98 108 Q88 120 80 114 Q86 96 88 96 Z" fill="#ffffff"/>
  <!-- School Ribbon / Bowtie -->
  <circle cx="80" cy="115" r="4.5" fill="#f59e0b"/>
  <path d="M78 115 L66 122 Q68 126 76 122 Z" fill="url(#ribbonGradFem)"/>
  <path d="M82 115 L94 122 Q92 126 84 122 Z" fill="url(#ribbonGradFem)"/>
  <path d="M78 117 L72 138 L78 135 L80 120 Z" fill="#166534"/>
  <path d="M82 117 L88 138 L82 135 L80 120 Z" fill="#166534"/>
  <!-- Head -->
  <ellipse cx="80" cy="68" rx="26" ry="30" fill="url(#skinGradFem)"/>
  <!-- Ears -->
  <circle cx="54" cy="70" r="5" fill="#fde68a"/>
  <circle cx="106" cy="70" r="5" fill="#fde68a"/>
  <circle cx="54" cy="73" r="2" fill="#fbbf24"/>
  <circle cx="106" cy="73" r="2" fill="#fbbf24"/>
  <!-- Eyes -->
  <ellipse cx="70" cy="68" rx="3" ry="3.5" fill="#1e293b"/>
  <ellipse cx="90" cy="68" rx="3" ry="3.5" fill="#1e293b"/>
  <circle cx="71" cy="67" r="1" fill="#ffffff"/>
  <circle cx="91" cy="67" r="1" fill="#ffffff"/>
  <path d="M66 64 Q70 63 74 65" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M86 65 Q90 63 94 64" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Eyebrows -->
  <path d="M65 61 Q70 59 75 62" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M85 62 Q90 59 95 61" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Cheeks Blush -->
  <circle cx="64" cy="75" r="4" fill="#fda4af" opacity="0.5"/>
  <circle cx="96" cy="75" r="4" fill="#fda4af" opacity="0.5"/>
  <!-- Nose -->
  <path d="M79 73 Q80 77 82 77" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M74 83 Q80 88 86 83" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Hair: Neat female student bangs and shoulder hair -->
  <path d="M50 64 C48 34, 68 26, 80 26 C92 26, 112 34, 110 64 C104 50, 96 44, 80 44 C64 44, 56 50, 50 64 Z" fill="#1e293b"/>
  <!-- Side locks -->
  <path d="M51 60 C53 74, 55 84, 59 90 C56 86, 52 74, 51 60 Z" fill="#1e293b"/>
  <path d="M109 60 C107 74, 105 84, 101 90 C104 86, 108 74, 109 60 Z" fill="#1e293b"/>
  <!-- Hair Highlight -->
  <path d="M62 38 Q80 34 98 38" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
