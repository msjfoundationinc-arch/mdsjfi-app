    <linearGradient id="tieGradMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGradMale)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Uniform Shoulders -->
  <path d="M26 156 C30 120, 52 108, 80 108 C108 108, 130 120, 134 156 Z" fill="url(#uniformGradMale)"/>
  <!-- Uniform Blazer / Trim -->
