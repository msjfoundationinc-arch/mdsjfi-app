  <polygon points="98,106 80,118 86,96" fill="#e2e8f0"/>
  <polygon points="64,106 80,116 76,96" fill="#ffffff"/>
  <polygon points="96,106 80,116 84,96" fill="#ffffff"/>
  <!-- School Necktie -->
