  <path d="M51 64 C50 36, 68 28, 80 28 C94 28, 110 36, 109 64 C104 52, 98 46, 88 46 C76 46, 64 54, 51 64 Z" fill="#1e293b"/>
  <path d="M52 64 C56 50, 68 44, 82 44 C90 44, 98 48, 106 58 C96 52, 88 50, 78 52 C68 54, 58 60, 52 64 Z" fill="#334155"/>
