  <polygon points="76,116 84,116 86,148 80,154 74,148" fill="url(#tieGradMale)"/>
  <circle cx="80" cy="122" r="2" fill="#fbbf24"/>
  <!-- Head -->
  <ellipse cx="80" cy="68" rx="27" ry="32" fill="url(#skinGradMale)"/>
  <!-- Ears -->
  <circle cx="53" cy="70" r="6" fill="#fed7aa"/>
  <circle cx="107" cy="70" r="6" fill="#fed7aa"/>
  <!-- Face Features: Eyes -->
  <ellipse cx="70" cy="68" rx="3" ry="3.5" fill="#1e293b"/>
  <ellipse cx="90" cy="68" rx="3" ry="3.5" fill="#1e293b"/>
  <circle cx="71" cy="67" r="1" fill="#ffffff"/>
  <circle cx="91" cy="67" r="1" fill="#ffffff"/>
  <!-- Eyebrows -->
  <path d="M64 61 Q70 59 76 62" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M84 62 Q90 59 96 61" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Nose -->
  <path d="M79 72 Q80 77 82 77" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M73 83 Q80 89 87 83" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
